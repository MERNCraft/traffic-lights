<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <link rel="stylesheet" href="styles.css">
  <title>Traffic Lights</title>
</head>
<body>
  <main>
    <div id="country">
      <label class="fr">
        <input type="radio" name="country" checked>
        <span>FR</span>
      </label>
      <label class="uk">
        <input type="radio" name="country">
        <span>UK</span>
      </label>
    </div>

    <div id="lights">
        <label class="ready">
          <input type="radio" name="lights">
          <span class="trigger"></span>
        </label>
        <label class="red">
          <input type="radio" name="lights" checked>
          <span class="trigger"></span>
          <span class="circle"></span>
        </label>
        <label class="amber">
          <input type="radio" name="lights">
          <span class="trigger"></span>
          <span class="circle"></span>
        </label>
        <label class="green">
          <input type="radio" name="lights">
          <span class="trigger"></span>
          <span class="circle"></span>
        </label>
    </div>

    <a
      href="https://github.com/MERNCraft/traffic-lights"
      target="github"
    >
      <img src="github.svg" alt="github">
    </a>
  </main>
</body>
</html>
